name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up upstream stable-diffusion.cpp master changes.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stable-diffusion-cpp.docker

jobs:
  # Resolve upstream master HEAD and decide whether a build is needed.
  # Scheduled runs are skipped when upstream hasn't moved since the last build
  # (tracked via the sd.cpp.revision label on :latest); push/dispatch always build.
  check:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.decide.outputs.build_needed }}
      sdcpp_sha: ${{ steps.resolve.outputs.sdcpp_sha }}
    steps:
      - name: Resolve upstream master HEAD
        id: resolve
        run: |
          sha=$(git ls-remote https://github.com/leejet/stable-diffusion.cpp.git refs/heads/master | cut -f1)
          echo "sdcpp_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream master HEAD: $sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: decide
        run: |
          build_needed=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            last_built=$(docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE_NAME:latest" 2>/dev/null \
              | jq -r '.config.Labels["sd.cpp.revision"] // empty' || true)
            echo "Last built upstream revision: ${last_built:-<none>}"
            if [ -n "$last_built" ] && [ "$last_built" = "${{ steps.resolve.outputs.sdcpp_sha }}" ]; then
              build_needed=false
              echo "Upstream unchanged since last build, skipping."
            fi
          fi
          echo "build_needed=$build_needed" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            sd.cpp.revision=${{ needs.check.outputs.sdcpp_sha }}
          build-args: |
            SDCPP_REF=${{ needs.check.outputs.sdcpp_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune old image versions (keep 5 newest)
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: stable-diffusion-cpp.docker
          cut-off: 0s
          keep-n-most-recent: 5
          dry-run: false
